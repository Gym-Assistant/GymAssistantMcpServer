name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: ${{ vars.CI_RUNNER_MODE != 'local' || (github.event.repository.private == true && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '["self-hosted","macOS","ARM64","gymassistant-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/runner-environment
        with:
          runner-mode: ${{ vars.CI_RUNNER_MODE }}
          docker: 'true'

      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'

      - uses: docker/setup-buildx-action@v3

      - name: Verify required Docker platforms
        run: |
          docker buildx inspect --bootstrap > "$RUNNER_TEMP/mcp-buildx-platforms.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/mcp-buildx-platforms.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/mcp-buildx-platforms.txt"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag without 'v'
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          task_secrets=$(mktemp -d "$RUNNER_TEMP/mcp-build-secrets.XXXXXX")
          trap 'rm -rf "$task_secrets"' EXIT
          printf '%s' "$GH_USER" > "$task_secrets/ghuser"
          printf '%s' "$GH_TOKEN" > "$task_secrets/ghpat"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --secret "id=ghuser,src=$task_secrets/ghuser" \
            --secret "id=ghpat,src=$task_secrets/ghpat" \
            --push \
            -t ghcr.io/gym-assistant/gymassistant-mcp-server:${{ steps.tag.outputs.version }} \
            -t ghcr.io/gym-assistant/gymassistant-mcp-server:latest \
            .

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
