name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish-source:
    # A public MCP release uses public source and PyPI dependencies, never private GHCR/NuGet.
    if: ${{ vars.CI_RUNNER_MODE != 'local' || (github.event.repository.private == true && github.actor != 'dependabot[bot]') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '["self-hosted","macOS","ARM64","gymassistant-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-environment
        with:
          runner-mode: ${{ vars.CI_RUNNER_MODE }}
      - uses: actions/setup-python@v5
        if: vars.CI_RUNNER_MODE != 'local'
        with:
          python-version: '3.14'
      - name: Verify local Python runtime
        if: vars.CI_RUNNER_MODE == 'local'
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 14)'
      - name: Create isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/gym-mcp-python"
          echo "$RUNNER_TEMP/gym-mcp-python/bin" >> "$GITHUB_PATH"
      - name: Install public dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/local-gymassistant/requirements.txt
      - name: Verify candidate
        run: |
          python -m unittest discover -s integrations/local-gymassistant -q
          python integrations/local-gymassistant/verify_stdio.py
          python integrations/local-gymassistant/verify_plans_stdio.py
      - name: Publish GitHub source release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
