name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    # Public forks and bots never reach the owner's Mac. MCP normally uses hosted CI.
    if: ${{ vars.CI_RUNNER_MODE != 'local' || (github.event.repository.private == true && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '["self-hosted","macOS","ARM64","gymassistant-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-environment
        with:
          runner-mode: ${{ vars.CI_RUNNER_MODE }}
      - uses: actions/setup-python@v5
        if: vars.CI_RUNNER_MODE != 'local'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: integrations/local-gymassistant/requirements.txt
      - name: Verify local Python runtime
        if: vars.CI_RUNNER_MODE == 'local'
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 14)'
      - name: Create isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/gym-mcp-python"
          echo "$RUNNER_TEMP/gym-mcp-python/bin" >> "$GITHUB_PATH"
      - name: Install public dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/local-gymassistant/requirements.txt
      - name: Unit and isolated HTTP checks
        run: python -m unittest discover -s integrations/local-gymassistant -v
      - name: Real stdio, synthetic workouts and Health
        run: python integrations/local-gymassistant/verify_stdio.py
      - name: Real stdio, synthetic plans and writes
        run: python integrations/local-gymassistant/verify_plans_stdio.py
