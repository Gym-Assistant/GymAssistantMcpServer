name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        env:
          NuGetPackageSourceCredentials_gym: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Real stdio initialize, tools and health check
        run: python3 scripts/verify-stdio.py dotnet src/GymAssistant.McpServer/bin/Release/net10.0/GymAssistant.McpServer.dll

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: integrations/local-gymassistant/requirements.txt

      - name: Install pinned requirements
        run: python -m pip install --disable-pip-version-check -r integrations/local-gymassistant/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s integrations/local-gymassistant -v

      - name: Real stdio on synthetic API (workouts, records, Health)
        run: python integrations/local-gymassistant/verify_stdio.py

      - name: Real stdio on synthetic API (plans)
        run: python integrations/local-gymassistant/verify_plans_stdio.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker build (no push)
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          trap 'rm -f /tmp/ghuser /tmp/ghpat' EXIT
          echo -n "$GH_USER" > /tmp/ghuser
          echo -n "$GH_TOKEN" > /tmp/ghpat
          docker buildx build \
            --secret id=ghuser,src=/tmp/ghuser \
            --secret id=ghpat,src=/tmp/ghpat \
            --load \
            -t gymassistant/mcp-server:ci .
          test "$(docker image inspect gymassistant/mcp-server:ci --format '{{.Config.User}}')" != 0
          test -n "$(docker image inspect gymassistant/mcp-server:ci --format '{{.Config.User}}')"
          python3 scripts/verify-stdio.py docker gymassistant/mcp-server:ci
