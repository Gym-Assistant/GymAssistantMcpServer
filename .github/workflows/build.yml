name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  dotnet:
    if: ${{ vars.CI_RUNNER_MODE != 'local' || (github.event.repository.private == true && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '["self-hosted","macOS","ARM64","gymassistant-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/runner-environment
        with:
          runner-mode: ${{ vars.CI_RUNNER_MODE }}

      - name: Verify local .NET SDK
        if: vars.CI_RUNNER_MODE == 'local'
        run: '[[ $(dotnet --version) == 10.* ]]'

      - uses: actions/setup-dotnet@v4
        if: vars.CI_RUNNER_MODE != 'local'
        with:
          dotnet-version: 10.0.x

      - name: Runner isolation guards
        run: python3 scripts/ci/test_runner_environment.py

      - name: Restore locked dependencies
        env:
          NuGetPackageSourceCredentials_gym: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Real stdio initialize, tools and health check
        run: python3 scripts/verify-stdio.py dotnet src/GymAssistant.McpServer/bin/Release/net10.0/GymAssistant.McpServer.dll

  python:
    if: ${{ vars.CI_RUNNER_MODE != 'local' || (github.event.repository.private == true && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '["self-hosted","macOS","ARM64","gymassistant-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/runner-environment
        with:
          runner-mode: ${{ vars.CI_RUNNER_MODE }}

      - name: Verify local Python runtime
        if: vars.CI_RUNNER_MODE == 'local'
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 14), "Python 3.14 is required"'

      - uses: actions/setup-python@v5
        if: vars.CI_RUNNER_MODE != 'local'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: integrations/local-gymassistant/requirements.txt

      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-python"
          echo "$RUNNER_TEMP/mcp-python/bin" >> "$GITHUB_PATH"

      - name: Install pinned requirements
        run: python -m pip install --disable-pip-version-check -r integrations/local-gymassistant/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s integrations/local-gymassistant -v

      - name: Real stdio on synthetic API (workouts, records, Health)
        run: python integrations/local-gymassistant/verify_stdio.py

      - name: Real stdio on synthetic API (plans)
        run: python integrations/local-gymassistant/verify_plans_stdio.py

  docker:
    if: ${{ vars.CI_RUNNER_MODE != 'local' || (github.event.repository.private == true && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'local' && '["self-hosted","macOS","ARM64","gymassistant-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/runner-environment
        with:
          runner-mode: ${{ vars.CI_RUNNER_MODE }}
          docker: 'true'

      - uses: docker/setup-buildx-action@v3

      - name: Docker build (no push)
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          task_secrets=$(mktemp -d "$RUNNER_TEMP/mcp-build-secrets.XXXXXX")
          task_image="gymassistant/mcp-server:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { rm -rf "$task_secrets"; docker image rm "$task_image" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          printf '%s' "$GH_USER" > "$task_secrets/ghuser"
          printf '%s' "$GH_TOKEN" > "$task_secrets/ghpat"
          docker buildx build \
            --secret "id=ghuser,src=$task_secrets/ghuser" \
            --secret "id=ghpat,src=$task_secrets/ghpat" \
            --load \
            -t "$task_image" .
          test "$(docker image inspect "$task_image" --format '{{.Config.User}}')" != 0
          test -n "$(docker image inspect "$task_image" --format '{{.Config.User}}')"
          python3 scripts/verify-stdio.py docker "$task_image"
