name: Prepare isolated runner environment
description: Validate the trusted local runner and isolate Docker credentials from the workstation.
inputs:
  docker:
    description: Prepare the local Linux Docker daemon and a temporary client configuration.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Validate runner and isolate Docker configuration
      shell: bash
      env:
        GA_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE }}
        GA_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        GA_EVENT_NAME: ${{ github.event_name }}
        GA_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        GA_ACTOR: ${{ github.actor }}
        GA_PREPARE_DOCKER: ${{ inputs.docker }}
      run: bash scripts/ci/prepare-runner.sh
